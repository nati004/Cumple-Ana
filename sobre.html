<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Boreal Pure CSS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #030814;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Fondo con estrellas estáticas usando box-shadow */
    .sky {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at bottom, #0d1d33 0%, #030814 100%);
    }

    /* Contenedor principal de la Aurora */
    .aurora-container {
      position: absolute;
      top: -20vh;
      left: -10vw;
      width: 120vw;
      height: 90vh;
      filter: blur(50px);
      mix-blend-mode: screen;
      opacity: 0.85;
      pointer-events: none;
    }

    /* Capa genérica de cortina de aurora */
    .aurora-curtain {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      will-change: transform, opacity;
    }

    /* Cortina 1: Verdes turquesa */
    .curtain-1 {
      background: linear-gradient(
        180deg,
        rgba(0, 255, 170, 0) 0%,
        rgba(0, 255, 170, 0.7) 40%,
        rgba(0, 200, 255, 0.4) 70%,
        rgba(0, 0, 0, 0) 100%
      );
      animation: wave1 12s ease-in-out infinite alternate;
    }

    /* Cortina 2: Tonos esmeralda y cian profundo */
    .curtain-2 {
      background: linear-gradient(
        180deg,
        rgba(0, 255, 128, 0) 0%,
        rgba(0, 229, 255, 0.6) 45%,
        rgba(40, 100, 255, 0.3) 75%,
        rgba(0, 0, 0, 0) 100%
      );
      animation: wave2 18s ease-in-out infinite alternate;
    }

    /* Cortina 3: Púrpura / Rosado superior */
    .curtain-3 {
      background: linear-gradient(
        180deg,
        rgba(180, 0, 255, 0) 0%,
        rgba(150, 0, 255, 0.4) 35%,
        rgba(0, 255, 150, 0.5) 65%,
        rgba(0, 0, 0, 0) 100%
      );
      animation: wave3 15s ease-in-out infinite alternate;
    }

    /* Animaciones de ondulación mediante transformaciones 2D/3D (Acelerado por Hardware) */
    @keyframes wave1 {
      0% {
        transform: translateY(0) rotate(-4deg) scaleY(1) scaleX(1);
      }
      50% {
        transform: translateY(40px) rotate(2deg) scaleY(1.2) scaleX(1.1);
      }
      100% {
        transform: translateY(-20px) rotate(-2deg) scaleY(0.9) scaleX(0.95);
      }
    }

    @keyframes wave2 {
      0% {
        transform: translateY(20px) rotate(3deg) scaleX(1.1);
      }
      50% {
        transform: translateY(-30px) rotate(-3deg) scaleX(0.9);
      }
      100% {
        transform: translateY(50px) rotate(5deg) scaleX(1.05);
      }
    }

    @keyframes wave3 {
      0% {
        transform: translateY(-10px) rotate(-1deg) scaleY(1.1);
      }
      50% {
        transform: translateY(30px) rotate(4deg) scaleY(0.85);
      }
      100% {
        transform: translateY(-40px) rotate(-5deg) scaleY(1.15);
      }
    }
  </style>
</head>
<body>

  <div class="sky"></div>

  <!-- Luces de la aurora boreal -->
  <div class="aurora-container">
    <div class="aurora-curtain curtain-1"></div>
    <div class="aurora-curtain curtain-2"></div>
    <div class="aurora-curtain curtain-3"></div>
  </div>

</body>
</html>
