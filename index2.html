<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnaVidal Cumple 🌟</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Permanent+Marker&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: linear-gradient(135deg, #090c15 0%, #0d121d 40%, #121826 70%, #06080e 100%);
            color: #e2e8f0;
            font-family: 'Quicksand', sans-serif;
            min-height: 320vh;
            user-select: none;
        }

        .script-font {
            font-family: 'Great Vibes', cursive;
        }

        .marker-font {
            font-family: 'Permanent Marker', cursive;
        }

        /* Canvas de estrellas de fondo */
        #sky-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .side-glow-layer {
            position: fixed;
            top: -10%;
            left: -15%;
            width: 60%;
            height: 120%;
            pointer-events: none;
            z-index: 2;
            opacity: 0.35;
            background: radial-gradient(ellipse at left center, rgba(125, 160, 195, 0.4) 0%, rgba(60, 90, 120, 0.15) 45%, transparent 75%);
            filter: blur(60px);
        }

        .comet-container {
            position: fixed;
            top: 42%;
            left: 32%;
            z-index: 2;
            pointer-events: none;
            transform: rotate(-18deg);
            opacity: 0.9;
        }

        .comet-head {
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 
                0 0 10px #ffffff,
                0 0 20px rgba(255, 255, 255, 0.8),
                0 0 35px rgba(180, 220, 255, 0.6);
            position: relative;
        }

        .comet-tail {
            position: absolute;
            top: 50%;
            left: 6px;
            transform: translateY(-50%);
            width: 110px;
            height: 12px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.85) 0%, rgba(190, 225, 255, 0.4) 30%, rgba(140, 185, 230, 0.1) 70%, transparent 100%);
            border-radius: 50% 0 0 50%;
            filter: blur(1.5px);
        }

        .top-hero-header {
            position: absolute;
            top: 50vh;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            pointer-events: auto;
            width: 100%;
            padding: 0 1rem;
        }

        /* --- DECORACIONES ESTILO FANZINE / COLLAGE REPARTIDAS --- */
        
        .bg-estre-container {
            position: absolute;
            top: 25vh;
            right: 17%;
            width: 320px;
            opacity: 0.80;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: screen;
            transform: rotate(8deg);
            filter: drop-shadow(0 0 20px rgba(140, 100, 200, 0.4));
        }

        /* Imagen 'mono.PNG'*/
        .bg-mono-left {
            position: absolute;
            top: 300vh;
            left: 7%;
            width: 950px;
            height: auto;
            z-index: 6;
            pointer-events: none;
        }

        .collage-tag-price {
            position: absolute;
            top: 25vh;
            left: 8%;
            background: #f8fafc;
            color: #0f172a;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.8rem;
            padding: 4px 10px;
            border: 1px dashed #64748b;
            transform: rotate(-12deg);
            box-shadow: 2px 2px 8px rgba(0,0,0,0.4);
            z-index: 6;
            pointer-events: none;
        }

        .collage-date-badge {
            position: absolute;
            top: 110vh;
            right: 10%;
            background: #e2e8f0;
            color: #0f172a;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 6px 14px;
            transform: rotate(5deg);
            box-shadow: 3px 3px 10px rgba(0,0,0,0.5);
            z-index: 6;
            pointer-events: none;
        }
        .collage-date-badge::before {
            content: "";
            position: absolute;
            top: -8px;
            left: 20%;
            width: 35px;
            height: 14px;
            background: rgba(255, 255, 255, 0.4);
            transform: rotate(-4deg);
        }

        /* BOB EMO */
        .camouflaged-bob {
            position: absolute;
            top: 480vh;
            right: 3%;
            width: 250px;
            max-width: 80vw;
            opacity: 0.25;
            mix-blend-mode: luminosity;
            filter: blur(0.5px) contrast(1.1);
            z-index: 3;
            pointer-events: none;
        }

        /* Estrellas */
        .star-node {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 10;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
        }

        .star-svg-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floatStar var(--float-duration, 4s) infinite ease-in-out var(--float-delay, 0s),
                       twinkleStar var(--twinkle-duration, 3s) infinite ease-in-out var(--float-delay, 0s);
        }

        .star-svg {
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .star-node:hover {
            transform: translate(-50%, -50%) scale(1.4) rotate(12deg);
            z-index: 30;
        }

        .star-node:hover .star-svg {
            filter: brightness(1.3) drop-shadow(0 0 15px rgba(255, 255, 255, 0.9));
        }

        @keyframes floatStar {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(4deg); }
        }

        @keyframes twinkleStar {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 1; }
        }

        .star-tooltip {
            position: absolute;
            top: 110%;
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            white-space: nowrap;
            background: rgba(9, 12, 21, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #f1f5f9;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .star-node:hover .star-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(8px);
        }

        /* Colores en el formulario */
        .color-option {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .color-option.selected {
            border-color: #38bdf8;
            transform: scale(1.15);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        .glass-card {
            background: rgba(13, 18, 29, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            color: #f1f5f9;
        }

        .modal-active {
            opacity: 1 !important;
            pointer-events: auto !important;
            transform: scale(1) translateY(0) !important;
        }
    </style>
</head>
<body class="relative min-h-[320vh] w-full">

    <!-- Canvas de Fondo y Capas de Luz-->
    <canvas id="sky-canvas"></canvas>
    <div class="side-glow-layer"></div>
    
    <!-- Cometa flotante -->
    <div class="comet-container">
        <div class="comet-head">
            <div class="comet-tail"></div>
        </div>
    </div>

    <img src="estre.PNG" alt="Estética" class="bg-estre-container">

    <img src="mono.PNG" alt="Mono" class="bg-mono-left">

    <div class="collage-tag-price">Cuak!</div>

    <!-- Titulo de cumple -->
    <div class="top-hero-header">
        <h1 class="script-font text-6xl md:text-8xl text-white font-normal drop-shadow-[0_4px_16px_rgba(0,0,0,0.8)] tracking-wide">
            Feliz Cumpleaños
        </h1>
        <p class="text-sm md:text-base text-slate-300 font-medium mt-2 drop-shadow-[0_2px_4px_rgba(0,0,0,0.6)]">
            Toca las estrellas para leer los mensajes que te han dejado
        </p>
    </div>

    <img src="emobieber.png" alt="Emo Bob" class="camouflaged-bob">

    <div id="universe-container" class="absolute inset-0 w-full h-full z-10 pointer-events-auto"></div>

    <div class="fixed bottom-6 right-6 z-30 flex items-center gap-3">
        <button id="btn-add-star" class="glass-card px-5 py-3 rounded-full flex items-center gap-2.5 text-sm font-bold text-slate-200 hover:text-white transition-all hover:scale-105 shadow-md">
            <img src="anabellota.gif" alt="Anabellota" class="w-6 h-6 object-contain rounded-full">
            <span>+ Agregar mensaje</span>
        </button>
    </div>

    <div id="message-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300 transform scale-95">
        <div id="modal-backdrop" class="absolute inset-0 bg-black/75 backdrop-blur-sm"></div>

        <div class="glass-card relative w-full max-w-md rounded-3xl p-6 md:p-8 text-center z-10 overflow-hidden shadow-2xl">
            <div class="relative mb-3 flex justify-center">
                <div class="w-14 h-14 rounded-full bg-slate-900 flex items-center justify-center shadow-md border border-slate-700 overflow-hidden p-1">
                    <img src="yoyo.PNG" alt="Yoyo" class="w-full h-full object-cover rounded-full">
                </div>
            </div>

            <div id="modal-title" class="text-xs uppercase tracking-widest text-slate-400 font-bold mb-2">
                Deseo Especial
            </div>

            <div class="relative max-h-60 overflow-y-auto custom-scroll my-4 px-2">
                <p id="modal-text" class="text-base md:text-lg text-slate-200 font-medium leading-relaxed italic">
                    "¡Feliz cumpleaños! "
                </p>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-700/80 flex items-center justify-between text-xs">
                <span id="modal-sender" class="font-bold text-slate-300 text-sm">De: Nati</span>
                <span id="modal-date" class="text-slate-400">Con cariño</span>
            </div>

            <button id="btn-close-modal" class="mt-6 w-full py-3 rounded-2xl bg-sky-700 hover:bg-sky-600 text-white font-bold text-sm shadow-md transition-all">
                Cerrar Mensaje
            </button>
        </div>
    </div>

    <div id="add-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300 transform scale-95">
        <div id="add-modal-backdrop" class="absolute inset-0 bg-black/75 backdrop-blur-sm"></div>

        <div class="glass-card relative w-full max-w-md rounded-3xl p-6 md:p-8 z-10 shadow-2xl">
            <h2 class="text-2xl text-center text-slate-100 font-bold mb-1">Escribe tu mensaje!</h2>

            <form id="add-star-form" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2">Color de la estrella</label>
                    <div class="flex items-center justify-center gap-4 py-1">
                        <div class="color-option selected" style="background-color: #ffffff;" data-color="#ffffff" title="Blanco"></div>
                        <div class="color-option" style="background-color: #d7bde2;" data-color="#d7bde2" title="Lila"></div>
                        <div class="color-option" style="background-color: #fff4b8;" data-color="#fff4b8" title="Amarillo"></div>
                        <div class="color-option" style="background-color: #ffb3c6;" data-color="#ffb3c6" title="Rosa"></div>
                        <div class="color-option" style="background-color: #b3e5fc;" data-color="#b3e5fc" title="Celeste"></div>
                    </div>
                    <input type="hidden" id="input-color" value="#ffffff">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Título del Deseo</label>
                    <input type="text" id="input-title" required placeholder="Ej. ¡Muchas Felicidades!" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Mensaje de Felicitación</label>
                    <textarea id="input-message" rows="3" required placeholder="Escribe tu mensaje especial..." class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">De parte de</label>
                    <input type="text" id="input-sender" required placeholder="Tu nombre" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500">
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="button" id="btn-cancel-add" class="w-1/2 py-2.5 rounded-xl border border-slate-700 text-slate-300 text-sm font-semibold hover:bg-slate-800 transition-all">
                        Cancelar
                    </button>
                    <button type="submit" class="w-1/2 py-2.5 rounded-xl bg-sky-700 hover:bg-sky-600 text-white font-bold text-sm shadow-md transition-all">
                        Crear Estrella
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const initialStarMessages = [
            { id: 1, title: "Titulo 1", message: "Mensaje prueba 1", sender: "De: Nati", date: "Hoy", x: 15, y: 18, size: 75, color: "#ffffff" },
            { id: 2, title: "Titulo 2", message: "Mensaje prueba 2", sender: "De: pepe", date: "Hoy", x: 82, y: 22, size: 85, color: "#fff4b8" },
            { id: 3, title: "Titulo 3", message: "Mensaje prueba 3", sender: "De: pepe 2", date: "Hoy", x: 50, y: 35, size: 55, color: "#b3e5fc" },
            { id: 4, title: "Titulo 4", message: "Mensaje prueba 4", sender: "De: nati 2", date: "Hoy", x: 22, y: 75, size: 85, color: "#ffb3c6" },
            { id: 5, title: "Titulo 5", message: "Mensaje prueba 5", sender: "De: nati nat", date: "Hoy", x: 78, y: 80, size: 80, color: "#d7bde2" },
            { id: 6, title: "Titulo 6", message: "Mensaje prueba 6", sender: "De: pepito", date: "Hoy", x: 18, y: 110, size: 70, color: "#ffffff" },
            { id: 7, title: "Titulo 7", message: "Mensaje prueba 7", sender: "De: natalia", date: "Hoy", x: 82, y: 175, size: 85, color: "#fff4b8" },
            { id: 8, title: "Titulo 8", message: "Mensaje prueba 8", sender: "De: natiii", date: "Hoy", x: 25, y: 240, size: 75, color: "#b3e5fc" }
        ];

        // Cargar mensajes guardados en el navegador (permanentes) o usar los iniciales
        let starMessages = JSON.parse(localStorage.getItem('ana_cumple_stars')) || [...initialStarMessages];

        const canvas = document.getElementById('sky-canvas');
        const ctx = canvas.getContext('2d');
        let bgStars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initBgStars();
        }

        function initBgStars() {
            bgStars = [];
            const count = Math.floor((canvas.width * canvas.height) / 2200);
            for (let i = 0; i < count; i++) {
                bgStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5 + 0.3,
                    alpha: Math.random(),
                    speed: Math.random() * 0.012 + 0.003
                });
            }
        }

        function drawBgStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            bgStars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = Math.abs(star.alpha) * 0.95;
                ctx.fill();
            });
            requestAnimationFrame(drawBgStars);
        }

        // Estrellas Interactivas
        const universeContainer = document.getElementById('universe-container');

        function renderInteractiveStars() {
            universeContainer.innerHTML = '';
            starMessages.forEach((star) => {
                const node = document.createElement('div');
                node.className = 'star-node';
                node.style.left = `${star.x}%`;
                node.style.top = `${star.y}%`;
                node.style.width = `${star.size}px`;
                node.style.height = `${star.size}px`;

                const color = star.color || '#ffffff';
                const floatDuration = (4 + Math.random() * 2).toFixed(2);
                const twinkleDuration = (2.5 + Math.random() * 2).toFixed(2);
                const floatDelay = (Math.random() * 3).toFixed(2);

                node.innerHTML = `
                    <div class="star-svg-wrapper" style="--float-duration: ${floatDuration}s; --twinkle-duration: ${twinkleDuration}s; --float-delay: ${floatDelay}s;">
                        <svg class="star-svg" viewBox="0 0 512 512" style="filter: drop-shadow(0 0 12px ${color});">
                            <path fill="${color}" d="M256 0L330 170L512 195L379 323L412 504L256 417L100 504L133 323L0 195L182 170L256 0Z"/>
                        </svg>
                    </div>
                    <div class="star-tooltip">${star.title}</div>
                `;

                node.addEventListener('click', () => openMessageModal(star));
                universeContainer.appendChild(node);
            });
        }

        // Selector de color interactivo para mensajes
        const colorOptions = document.querySelectorAll('.color-option');
        const inputColor = document.getElementById('input-color');

        colorOptions.forEach(option => {
            option.addEventListener('click', () => {
                colorOptions.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                inputColor.value = option.getAttribute('data-color');
            });
        });

        const messageModal = document.getElementById('message-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');
        const modalSender = document.getElementById('modal-sender');
        const modalDate = document.getElementById('modal-date');

        function openMessageModal(star) {
            modalTitle.textContent = star.title;
            modalText.textContent = `"${star.message}"`;
            modalSender.textContent = star.sender.startsWith('De:') ? star.sender : `De: ${star.sender}`;
            modalDate.textContent = star.date || "Hoy";
            messageModal.classList.add('modal-active');
        }

        function closeMessageModal() {
            messageModal.classList.remove('modal-active');
        }

        document.getElementById('btn-close-modal').addEventListener('click', closeMessageModal);
        document.getElementById('modal-backdrop').addEventListener('click', closeMessageModal);

        // Agregar deseo
        const addModal = document.getElementById('add-modal');
        const btnAddStar = document.getElementById('btn-add-star');
        const btnCancelAdd = document.getElementById('btn-cancel-add');
        const addModalBackdrop = document.getElementById('add-modal-backdrop');
        const addStarForm = document.getElementById('add-star-form');

        btnAddStar.addEventListener('click', () => addModal.classList.add('modal-active'));

        function closeAddModal() {
            addModal.classList.remove('modal-active');
            addStarForm.reset();
            colorOptions.forEach(opt => opt.classList.remove('selected'));
            colorOptions[0].classList.add('selected');
            inputColor.value = "#ffffff";
        }

        btnCancelAdd.addEventListener('click', closeAddModal);
        addModalBackdrop.addEventListener('click', closeAddModal);

        addStarForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('input-title').value;
            const message = document.getElementById('input-message').value;
            const sender = document.getElementById('input-sender').value;
            const color = inputColor.value;

            const currentScrollYPercent = (window.scrollY / document.body.scrollHeight) * 100;
            const x = Math.floor(Math.random() * 70) + 15;
            const y = Math.floor(currentScrollYPercent + (Math.random() * 20 - 10));
            const size = Math.floor(Math.random() * 30) + 55;

            const newStar = {
                id: Date.now(),
                title: title,
                message: message,
                sender: `De: ${sender}`,
                date: "Hoy",
                x: x, y: y, size: size,
                color: color
            };

            starMessages.push(newStar);
            
            // GUARDAR PERMANENTEMENTE EN EL NAVEGADOR
            localStorage.setItem('ana_cumple_stars', JSON.stringify(starMessages));

            renderInteractiveStars();
            closeAddModal();

            setTimeout(() => openMessageModal(newStar), 300);
        });

        window.addEventListener('resize', resizeCanvas);

        window.onload = () => {
            resizeCanvas();
            drawBgStars();
            renderInteractiveStars();
        };
    </script>
</body>
</html>
