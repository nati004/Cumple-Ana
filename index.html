<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Vidal Cumple</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/reset.css">
    <link rel="stylesheet" href="./assets/main.css">
    <style>
        html {
            background-color: #030814 !important;
        }
        body {
            background: transparent !important;
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .posters {
            position: fixed !important;
            top: 50px !important;
            width: 280px !important;
            max-width: 35vw !important;
            height: auto !important;
            z-index: 5 !important;
            pointer-events: none !important;
            rotate: 20deg;
        }

        .posters.one { 
            left: 0 !important; 
            right: auto !important;
            rotate: -20deg;
        }
        .posters:not(.one) { 
            right: 0 !important; 
        }

        /* --- AURORA BOREAL DE FONDO (FIJA EN EL CENTRO/FONDO) --- */
.aurora-footer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #02040a;
    overflow: hidden;
    z-index: -1; /* Detrás de todo el contenido */
    pointer-events: none;
}

#auroraCanvas {
    display: block;
    width: 100%;
    height: 100%;
    opacity: 0.8;
}

        .aurora-footer::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(to bottom, rgba(13, 18, 29, 0.95) 0%, rgba(2, 4, 10, 0) 100%);
            z-index: 3;
            pointer-events: none;
        }

        #cometsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>

<body>
    <img class="posters one" src="./assets/cartel.webp" alt="Cartel decorativo izquierdo">
    <img class="posters" src="./assets/cartel.webp" alt="Cartel decorativo derecho">

    <div class="title">
        <img id="slider-img" src="./assets/1.webp" alt="Slider">
        <p>Toca las estrellas para leer los mensajes que te han dejado</p>
    </div>

    <div class="container-stars">
        <div class="container-star"></div>
    </div>

    <!-- Modal / Contenedor del Sobre -->
    <div id="envelope-modal" class="envelope-modal">
        <div class="wrapper">
            <button id="closeModalBtn" class="close-modal-btn">&times; Cerrar</button>

            <div id="envelope" class="envelope">
                <div id="envelope-author" class="envelope-author-tag">De: ...</div>

                <div id="letter" class="letter">
                    <div class="letter-content">
                        <img id="letter-img" src="" alt="Carta de felicitación">
                    </div>
                </div>
                <div class="envelope-flap"></div>
                <div class="flap-left"></div>
                <div class="flap-right"></div>
                <div class="flap-bottom"></div>
            </div>
            <p id="instruction" class="instruction">Haz clic en el sobre para abrirlo</p>

            <button id="resetBtn" class="reset-btn">Cerrar carta y sobre</button>
        </div>
    </div>

    <!-- AURORA BOREAL DE FONDO -->
    <footer class="aurora-footer">
        <canvas id="auroraCanvas"></canvas>
    </footer>

    <!-- CANVAS DE COMETAS -->
    <canvas id="cometsCanvas"></canvas>

    <div class="footer-banner">
        <img id="footer-slider-img" src="./assets/hbd-1.webp" alt="Happy Birthday Slider" />
    </div>

    <div class="gift-section">
        <div id="gift-box" class="gift-box">
            <div class="gift-lid">
                <div class="gift-bow"></div>
            </div>
            <div class="gift-body">
                <div class="gift-ribbon-vertical"></div>
            </div>
        </div>
        <p class="gift-instruction">Toca la caja para abrir tu regalo</p>
    </div>

    <!-- MODAL O CONTENEDOR DEL VIDEO -->
    <div id="video-modal" class="video-modal">
        <div class="video-wrapper">
            <button id="closeVideoBtn" class="close-video-btn">&times; Cerrar</button>
            <video id="gift-video" controls playsinline>
                <!-- Cambia por la ruta de tu video -->
                <source src="./assets/REGALO DE LOS OG.mp4" type="video/mp4">
                Tu navegador no soporta videos.
            </video>
        </div>
    </div>


    <script src="./assets/index.js"></script>
    <script>
        // Script de cometas optimizado
        const cometsCanvas = document.getElementById('cometsCanvas');
        const cometsCtx = cometsCanvas.getContext('2d');
        let cWidth, cHeight;
        const comets = [];

        function resizeCometsCanvas() {
            cWidth = cometsCanvas.width = window.innerWidth;
            cHeight = cometsCanvas.height = window.innerHeight;
        }

        function spawnComet() {
            const fromTop = Math.random() > 0.35;
            comets.push({
                x: fromTop ? Math.random() * cWidth : -20,
                y: fromTop ? -20 : Math.random() * cHeight * 0.4,
                length: Math.random() * 50 + 40,
                speed: Math.random() * 2 + 3,
                angle: Math.PI / 4 + (Math.random() - 0.5) * 0.25,
                size: Math.random() * 0.8 + 1,
                opacity: 1
            });
            setTimeout(spawnComet, Math.random() * 2500 + 1500);
        }

        function animateComets() {
            cometsCtx.clearRect(0, 0, cWidth, cHeight);

            for (let i = comets.length - 1; i >= 0; i--) {
                const c = comets[i];
                c.x += Math.cos(c.angle) * c.speed;
                c.y += Math.sin(c.angle) * c.speed;
                c.opacity -= 0.003;

                if (c.opacity <= 0 || c.y > cHeight + 50 || c.x > cWidth + 50) {
                    comets.splice(i, 1);
                    continue;
                }

                const tailX = c.x - Math.cos(c.angle) * c.length;
                const tailY = c.y - Math.sin(c.angle) * c.length;

                cometsCtx.save();
                cometsCtx.globalAlpha = c.opacity;

                const grad = cometsCtx.createLinearGradient(c.x, c.y, tailX, tailY);
                grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                grad.addColorStop(0.4, 'rgba(179, 229, 252, 0.5)');
                grad.addColorStop(1, 'rgba(179, 229, 252, 0)');
                
                cometsCtx.beginPath();
                cometsCtx.moveTo(c.x, c.y);
                cometsCtx.lineTo(tailX, tailY);
                cometsCtx.strokeStyle = grad;
                cometsCtx.lineWidth = c.size;
                cometsCtx.lineCap = 'round';
                cometsCtx.stroke();

                cometsCtx.beginPath();
                cometsCtx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                cometsCtx.fillStyle = '#ffffff';
                cometsCtx.shadowBlur = 8;
                cometsCtx.shadowColor = '#b3e5fc';
                cometsCtx.fill();

                cometsCtx.restore();
            }

            requestAnimationFrame(animateComets);
        }

        window.addEventListener('resize', resizeCometsCanvas);
        window.addEventListener('load', () => {
            resizeCometsCanvas();
            animateComets();
            spawnComet();
            setTimeout(spawnComet, 800);
        });
    </script>
</body>

</html>
